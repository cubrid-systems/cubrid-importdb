<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 372" width="900" height="372"
     role="img" aria-label="How importdb derives the load order. Discover finds the dump's prefix, its layout and each file's role; Define replays the dump's own DDL into the target; Graph reads the target catalog for five classes, three foreign-key edges child to parent and one serial; Plan layers that graph into three level sets -- audit_log, product and region first, then customer, then orders -- and seventeen terminal tasks. The hand-scripted loaddb path has no such step: its three invocations are ordered by whoever types them, and a cycle it cannot order at all.">
  <title>The load order is read from the schema, not typed</title>
