<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 382" width="900" height="382"
     role="img" aria-label="The constraint lifecycle, two ways. Schema-first loaddb keeps every constraint live through the data phase, paying one b-tree write per row per index -- thirty-six writes for twelve rows -- with foreign-key checking off, so an orphan row loads clean and exits 0. CUBRID ImportDB strips the same constraints, streams the rows into bare heaps and runs three bulk builds afterwards; the foreign-key build is the check, so it halts at the offending row, withholds that one constraint, names the row and exits 1.">
