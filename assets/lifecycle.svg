<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 344" width="900" height="344"
     role="img" aria-label="The constraint lifecycle: loaddb keeps every constraint live during the data phase with foreign-key checking off; cubrid-importdb loads into bare heaps and builds the constraints afterwards, so the engine validates every foreign key.">
  <title>The constraint lifecycle, two ways</title>
  <style>
    /* Light is the base palette so a renderer that ignores @media still gets a
       correct picture. No CSS custom properties, for the same reason. */
    .bg      { fill: #ffffff; }
    .ink     { fill: #1f2328; }
    .muted   { fill: #57606a; }
    .faint   { fill: #8c959f; }
    .bad     { fill: #c0392b; }
    .good    { fill: #1a7f37; }
    .warn    { fill: #b7791f; }
    .box     { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.3; }
    .box-warn{ fill: #fdf6e7; stroke: #b7791f; stroke-width: 1.4; }
    .box-good{ fill: #eff7f0; stroke: #1a7f37; stroke-width: 1.4; }
    .box-bad { fill: #fdf0ee; stroke: #c0392b; stroke-width: 1.4; }
    .arrow   { fill: none; stroke: #8c959f; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .sep     { stroke: #e4e8ec; stroke-width: 1; }
    .divider { stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 3 3; }
    .tree    { fill: none; stroke: #b7791f; stroke-width: 1.2; stroke-linejoin: round; }
    .heap    { fill: none; stroke: #1a7f37; stroke-width: 1.2; }
    .heapfill{ fill: #cfe6d5; }

    @media (prefers-color-scheme: dark) {
      .bg      { fill: #0d1117; }
      .ink     { fill: #e6edf3; }
      .muted   { fill: #9198a1; }
      .faint   { fill: #6e7681; }
      .bad     { fill: #ff7b72; }
      .good    { fill: #3fb950; }
      .warn    { fill: #d29922; }
      .box     { fill: #161b22; stroke: #30363d; }
      .box-warn{ fill: #221a08; stroke: #d29922; }
      .box-good{ fill: #0d1f13; stroke: #3fb950; }
      .box-bad { fill: #251715; stroke: #ff7b72; }
      .arrow   { stroke: #6e7681; }
      .sep     { stroke: #21262d; }
      .divider { stroke: #30363d; }
      .tree    { stroke: #d29922; }
      .heap    { stroke: #3fb950; }
      .heapfill{ fill: #1c3b26; }
    }

    .lane  { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
             font-size: 14px; font-weight: 700; }
    .lanen { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
             font-size: 12px; }
    .bt    { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
             font-size: 12.5px; font-weight: 600; }
    .bs    { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
             font-size: 11px; }
    .note  { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
             font-size: 11.5px; }
    .res   { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
             font-size: 11.5px; font-weight: 600; }
  </style>

  <rect class="bg" x="0" y="0" width="900" height="344"/>

  <!-- ============ lane 1: the hand-scripted loaddb path ============ -->
  <text class="lane ink"  x="40" y="34">loaddb</text>
  <text class="lanen faint" x="106" y="34">schema first, so every constraint is live for the whole data phase</text>

  <g>
    <rect class="box" x="40" y="50" width="150" height="60" rx="6"/>
    <text class="bt ink"   x="115" y="74" text-anchor="middle">define schema</text>
    <text class="bs muted" x="115" y="92" text-anchor="middle">PK · UNIQUE · FK all live</text>

    <path class="arrow" d="M198,80 H214 M209,76 L214,80 L209,84"/>

    <rect class="box-warn" x="222" y="50" width="240" height="60" rx="6"/>
    <text class="bt warn"  x="342" y="72" text-anchor="middle">load rows</text>
    <text class="bs muted" x="342" y="89" text-anchor="middle">every b-tree maintained per row</text>
    <g transform="translate(300,94)">
      <path class="tree" d="M6,10 L11,2 L16,10 Z"/>
      <path class="tree" d="M34,10 L39,2 L44,10 Z"/>
      <path class="tree" d="M62,10 L67,2 L72,10 Z"/>
    </g>

    <path class="arrow" d="M470,80 H486 M481,76 L486,80 L481,84"/>

    <rect class="box" x="494" y="50" width="146" height="60" rx="6"/>
    <text class="bt ink"   x="567" y="74" text-anchor="middle">create indexes</text>
    <text class="bs muted" x="567" y="92" text-anchor="middle">the deferred ones only</text>
  </g>

  <text class="note bad" x="40" y="132">FOREIGN KEY checking is OFF for the entire data phase — and never turned back on to re-check.</text>

  <!-- result, lane 1 -->
  <line class="sep" x1="664" y1="20" x2="664" y2="324"/>
  <rect class="box-bad" x="692" y="46" width="184" height="86" rx="6"/>
  <text class="res bad"  x="706" y="68">An orphan row loads clean.</text>
  <text class="note muted" x="706" y="87">exit 0, nothing reported —</text>
  <text class="note muted" x="706" y="103">the FK is in the catalog and</text>
  <text class="note muted" x="706" y="119">the data violates it.</text>

  <line class="divider" x1="40" y1="164" x2="876" y2="164"/>

  <!-- ============ lane 2: cubrid-importdb ============ -->
  <text class="lane ink"  x="40" y="204">cubrid-importdb</text>
  <text class="lanen faint" x="182" y="204">constraints come off, data goes in flat, constraints go back on</text>

  <g>
    <rect class="box" x="40" y="220" width="124" height="60" rx="6"/>
    <text class="bt ink"   x="102" y="248" text-anchor="middle">define schema</text>
    <text class="bs muted" x="102" y="265" text-anchor="middle">from the dump</text>

    <path class="arrow" d="M172,250 H188 M183,246 L188,250 L183,254"/>

    <rect class="box" x="196" y="220" width="104" height="60" rx="6"/>
    <text class="bt ink"   x="248" y="248" text-anchor="middle">strip</text>
    <text class="bs muted" x="248" y="265" text-anchor="middle">PK · UNIQUE · FK</text>

    <path class="arrow" d="M308,250 H324 M319,246 L324,250 L319,254"/>

    <rect class="box-good" x="332" y="220" width="150" height="60" rx="6"/>
    <text class="bt good"  x="407" y="243" text-anchor="middle">load → bare heaps</text>
    <text class="bs muted" x="407" y="259" text-anchor="middle">nothing to maintain</text>
    <g transform="translate(383,264)">
      <rect class="heapfill" x="0"  y="2" width="14" height="4" rx="2"/>
      <rect class="heapfill" x="17" y="2" width="14" height="4" rx="2"/>
      <rect class="heapfill" x="34" y="2" width="14" height="4" rx="2"/>
    </g>

    <path class="arrow" d="M490,250 H506 M501,246 L506,250 L501,254"/>

    <rect class="box" x="514" y="220" width="126" height="60" rx="6"/>
    <text class="bt ink"   x="577" y="243" text-anchor="middle">bulk-build</text>
    <text class="bs muted" x="577" y="259" text-anchor="middle">PK · UNIQUE · index,</text>
    <text class="bs muted" x="577" y="273" text-anchor="middle">then ADD FOREIGN KEY</text>
  </g>

  <text class="note good" x="40" y="302">Building the FK over the loaded rows <tspan class="ink">is</tspan> the check — the engine validates every key as it goes.</text>

  <!-- result, lane 2 -->
  <rect class="box-good" x="692" y="212" width="184" height="86" rx="6"/>
  <text class="res good" x="706" y="234">Every FK holds.</text>
  <text class="note muted" x="706" y="253">Or the one that does not is</text>
  <text class="note muted" x="706" y="269">withheld, exit 1, and every</text>
  <text class="note muted" x="706" y="285">offending row is named.</text>
</svg>
