<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360"
     role="img" aria-label="When the per-class statistics are computed, and what the run prints. In the hand-scripted loaddb path they are computed at the end of the object load, and the index file loaded afterwards refreshes only the _db_index and _db_index_key catalog statistics -- so the class statistics predate the secondary indexes. importdb passes --no-statistics to every loader child and schedules STATS per class after that class's rebuilds and the index build, so the statistics see the finished table. On the right, the two surfaces the run shows: a progress block redrawn in place with per-file offsets, and the phase lines that scroll under it, ending in the consolidated report.">
  <title>The statistics are computed last, and the run shows it</title>
