<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="900" height="190"
     role="img" aria-label="CUBRID ImportDB: one command to reload a whole CUBRID database from an unloaddb dump">
  <title>CUBRID ImportDB</title>
  <style>
    /* CUBRID's brand palette, sampled from the official tangram mark at
       ftp.cubrid.org/CUBRID_Docs/Brochure/BI_Images/cubrid-logo-tangram-300.png.
       Light is the base so a renderer that ignores @media still gets a correct
       picture; no CSS custom properties, for the same reason. */
    .tred { fill: #FF2B36; }   .torange  { fill: #FF6305; }
    .tamber { fill: #FFAE00; } .tgreen   { fill: #00D936; }
    .tcyan { fill: #0091F8; }  .tmagenta { fill: #BE34A9; }
    .tnavy { fill: #002887; }

    .pending { fill: #eef0f3; stroke: #d4d9df; stroke-width: 1; }
    .slot    { fill: none; stroke: #b9c0c8; stroke-width: 1.2; stroke-dasharray: 3 2.5; }
    .frame   { fill: none; stroke: #b9c0c8; stroke-width: 1.4; stroke-dasharray: 4 3; }
    .frame-on{ fill: none; stroke: #00A62A; stroke-width: 1.8; }

    .bg     { fill: #f7f8fa; stroke: #dfe3e8; stroke-width: 1; }
    .ink    { fill: #1D1D1B; }
    .brand  { fill: #002887; }
    .muted  { fill: #5b6470; }
    .faint  { fill: #8d95a0; }
    .good   { fill: #00A62A; }
    .plate  { fill: #f7f8fa; }
    .rule   { stroke: #dfe3e8; stroke-width: 1; }
    .arrow  { fill: none; stroke: #8d95a0; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .drop   { fill: none; stroke: #FF6305; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .check  { fill: none; stroke: #00A62A; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }

    @media (prefers-color-scheme: dark) {
      .tnavy   { fill: #4C86E8; }
      .pending { fill: #1b2029; stroke: #2f3641; }
      .slot    { stroke: #49525e; }
      .frame   { stroke: #49525e; }
      .frame-on{ stroke: #00D936; }
      .bg      { fill: #14181e; stroke: #2b313a; }
      .ink     { fill: #e9edf2; }
      .brand   { fill: #4C86E8; }
      .muted   { fill: #98a1ad; }
      .faint   { fill: #6d7681; }
      .good    { fill: #00D936; }
      .plate   { fill: #14181e; }
      .rule    { stroke: #2b313a; }
      .arrow   { stroke: #6d7681; }
      .check   { stroke: #00D936; }
    }

    .wordmark { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
                font-size: 35px; font-weight: 700; letter-spacing: -0.6px; }
    .tag  { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 15px; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 14px; }
    .lab  { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 10.5px; font-weight: 600; letter-spacing: 0.8px; }
  </style>

  <rect class="bg" x="0.5" y="0.5" width="899" height="189" rx="10"/>

  <!-- The mark: a tangram square with its last piece dropping into place. The
       square is the finished database; importing is what completes it. -->
  <g>
    <polygon class="tamber" points="44.0,76.0 90.4,76.0 67.2,99.2"/>
    <polygon class="tgreen" points="44.0,76.0 67.2,99.2 44.0,122.4"/>
    <polygon class="tred" points="90.4,76.0 90.4,99.2 78.8,87.6"/>
    <polygon class="torange" points="67.2,99.2 78.8,87.6 90.4,99.2 78.8,110.8"/>
    <polygon class="tcyan" points="67.2,99.2 78.8,110.8 55.6,110.8"/>
    <polygon class="tmagenta" points="90.4,99.2 90.4,122.4 67.2,122.4"/>
    <polygon class="tnavy" points="55.6,110.8 78.8,110.8 90.4,122.4 67.2,122.4"/>
    <path class="drop" d="M67,50 V68 M60,62 L67,69.5 L74,62"/>
  </g>

  <text class="wordmark" x="124" y="86">
    <tspan class="ink">CUBRID</tspan><tspan class="brand"> ImportDB</tspan>
  </text>
  <text class="tag muted" x="126" y="118">Reload a whole database from an <tspan class="mono ink">unloaddb</tspan> dump in one</text>
  <text class="tag muted" x="126" y="140">command &#8212; and never leave a foreign key the data breaks.</text>

  <line class="rule" x1="590" y1="34" x2="590" y2="156"/>

  <!-- filling a defined-but-empty target, then closing it and checking it -->
  <g>
    <rect class="frame" x="618" y="38" width="52" height="52" rx="3"/>
    <polygon class="pending" points="622.0,42.0 666.0,42.0 644.0,64.0"/>
    <polygon class="tgreen" points="622.0,42.0 644.0,64.0 622.0,86.0"/>
    <polygon class="pending" points="666.0,42.0 666.0,64.0 655.0,53.0"/>
    <polygon class="pending" points="644.0,64.0 655.0,53.0 666.0,64.0 655.0,75.0"/>
    <polygon class="tcyan" points="644.0,64.0 655.0,75.0 633.0,75.0"/>
    <polygon class="tmagenta" points="666.0,64.0 666.0,86.0 644.0,86.0"/>
    <polygon class="tnavy" points="633.0,75.0 655.0,75.0 666.0,86.0 644.0,86.0"/>
    <text class="lab faint" x="644" y="112" text-anchor="middle">STRIP &#183; LOAD</text>
    <text class="lab faint" x="644" y="128" text-anchor="middle" opacity="0.75">bare heaps</text>

    <path class="arrow" d="M700,64 H726 M720,59 L726,64 L720,69"/>

    <rect class="frame-on" x="784" y="38" width="52" height="52" rx="3"/>
    <polygon class="tamber" points="788.0,42.0 832.0,42.0 810.0,64.0"/>
    <polygon class="tgreen" points="788.0,42.0 810.0,64.0 788.0,86.0"/>
    <polygon class="tred" points="832.0,42.0 832.0,64.0 821.0,53.0"/>
    <polygon class="torange" points="810.0,64.0 821.0,53.0 832.0,64.0 821.0,75.0"/>
    <polygon class="tcyan" points="810.0,64.0 821.0,75.0 799.0,75.0"/>
    <polygon class="tmagenta" points="832.0,64.0 832.0,86.0 810.0,86.0"/>
    <polygon class="tnavy" points="799.0,75.0 821.0,75.0 832.0,86.0 810.0,86.0"/>
    <g transform="translate(828,30)">
      <circle class="plate" cx="10" cy="10" r="10.5"/>
      <path class="check" d="M5,10.2 L8.4,13.6 L15,6.6"/>
    </g>
    <text class="lab good" x="810" y="112" text-anchor="middle">REBUILD &#183; VERIFY</text>
    <text class="lab faint" x="810" y="128" text-anchor="middle" opacity="0.75">every FK checked</text>
  </g>
</svg>
