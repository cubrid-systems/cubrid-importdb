# Functional test against the CUBRID nightly daily build.
#
# The nightly drop is what makes this cheap and exact. Each directory is named
# <version>-<commit>, and the drop carries BOTH artifacts from that one build:
#
#   cubrid-<v>.tar.gz                    the source tree  -> the internal headers
#                                        this utility compiles against
#   CUBRID-<v>-Linux.x86_64.tar.gz       the install      -> libcubridcs to link,
#                                        and a server to actually import into
#
# Taking both from the same drop removes the source/library skew entirely -- the
# failure mode a binary distribution would have (a signature that moved between
# the header you compiled against and the library you linked) cannot occur here.
#
# No engine build, and no access to the engine repo: the whole job needs nothing
# but this repo and ftp.cubrid.org.

name: nightly

on:
  # A push to main gets the full build and suite, because nothing else on main
  # does. contract.yml runs here too, but it never builds the utility -- it
  # checks the surface statically and the behaviour of an install. So before this
  # line the only thing a merge to main was checked against was that static
  # surface, and two branches that each built fine merged into a main that did
  # not compile at all (the enum entry each of them appended was terminal, and
  # git kept both without a conflict).
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      engine_version:
        description: 'nightly dir, e.g. 11.5.0.2494-4b6ae5c (blank = newest 11.5)'
        required: false
        default: ''
  pull_request:
    paths:
      # a change to how we build or to the sources themselves must be re-tested
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'tools/**'
      # and so must a change to the suite itself, now that this job runs it
      - 'tests/**'
      - '.github/workflows/nightly.yml'

permissions:
  contents: read

env:
  # No FTP_BASE here. tools/fetch_engine.sh defaults it to
  # https://ftp.cubrid.org/CUBRID_Engine and appends /nightly/daily_build/ itself;
  # setting the full path here produced .../nightly/daily_build/nightly/daily_build/,
  # a 404, and the resolve step exited 77 before this workflow had ever built
  # anything. contract.yml passes precisely because it sets no override.
  ENGINE_SERIES: '11.5'

jobs:
  nightly:
    name: build + import against the nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: cache the engine tarballs
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: engine/dl
          # keyed on the day, so a pinned re-run reuses the download and the
          # scheduled run picks up whatever is newest
          key: engine-nightly-${{ github.event.inputs.engine_version || format('{0}', github.run_id) }}
          restore-keys: engine-nightly-

      - name: fetch the engine (source + install, from the same drop)
        run: |
          if [ -n "${{ inputs.engine_version }}" ]; then
            bash tools/fetch_engine.sh --nightly-version "${{ inputs.engine_version }}" engine
          else
            bash tools/fetch_engine.sh --nightly "$ENGINE_SERIES" engine
          fi

      - name: report what we got
        id: pick
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . engine/engine.env
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT"   >> "$GITHUB_OUTPUT"
          echo "CUBRID=$PWD/engine/install" >> "$GITHUB_ENV"
          {
            echo "### engine $VERSION"
            echo
            echo "- commit \`$COMMIT\`"
            echo "- source and install came from the same drop, so a link failure here"
            echo "  is a real incompatibility, not skew"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: build deps
        run: |
          sudo apt-get update -qq
          # openjdk-17-jdk, NOT -headless: the engine's find_package(JNI REQUIRED)
          # is unconditional, and CMake's FindJNI wants AWT, whose libjawt.so the
          # headless JRE does not ship -- "Could NOT find JNI (missing: AWT)".
          # systemtap-sdt-dev provides dtrace. The engine defaults ENABLE_SYSTEMTAP
          # ON and hard-errors in CMake without it -- and the flag reaches the
          # generated config.h that OUR translation units compile against
          # (#define ENABLE_SYSTEMTAP 1), so turning it off to dodge the
          # dependency would build us against a different config.h than the
          # published engine was built with.
          sudo apt-get install -y -qq cmake ninja-build ccache gcc g++ \
            libncurses-dev bison flex openjdk-17-jdk systemtap-sdt-dev

      # The utility's translation units need the engine's GENERATED headers and
      # four 3rdparty header trees (rapidjson, re2, lz4 and the installed
      # includes). Those come from a CONFIGURED build tree -- but not from a built
      # engine, which is the saving: configure, then build only those targets.
      - name: cache the configured build tree
        id: cfgcache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: engine/build
          key: cfgtree-${{ steps.pick.outputs.version }}

      - name: configure the engine and build only its 3rdparty headers
        if: steps.cfgcache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cmake -S engine/src -B engine/build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          # header producers only -- NOT the engine
          cmake --build engine/build -j"$(nproc)" \
                --target rapidjson re2 lz4 libexpat libjansson
          for d in 3rdparty/include 3rdparty/Source/rapidjson/include \
                   3rdparty/Source/re2 3rdparty/Source/lz4/lib; do
            test -d "engine/build/$d" || { echo "::error::engine/build/$d missing after the 3rdparty build"; exit 1; }
          done

      - name: build cubrid-importdb against that source, linking that install
        run: |
          set -euo pipefail
          # the libstdc++ ABI is detected from the library, not assumed -- the
          # published binaries link libstdc++ statically with the pre-C++11
          # std::string ABI, so libcubridcs re-exports those symbols and this
          # binary resolves its own strings against them; a modern GCC defaults
          # to the other ABI and the result is one binary with two string ABIs
          cmake -S . -B build \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DCUBRID_SOURCE_DIR="$PWD/engine/src" \
                -DCUBRID_BUILD_DIR="$PWD/engine/build"
          cmake --build build -j"$(nproc)" 2>&1 | tee /tmp/build.log
          test -x build/cubrid-importdb

      - name: import something (the functional test)
        run: |
          set -euo pipefail
          bash tools/smoke.sh "$PWD/build/cubrid-importdb"

      # ---------------------------------------------------- the functional suite
      # Until now CI ran only the smoke test: one two-table dump, six catalog
      # assertions. The suite proper never ran anywhere but a developer's host,
      # which is a strange place to keep the only evidence the tool works.
      #
      # It runs here because this job already has the two expensive things it
      # needs -- a built binary and a real engine to serve databases -- so the
      # marginal cost is minutes, not a new job.
      #
      # perf is the one case left out, deliberately: it builds a 393,000-row
      # fixture and runs four paired imports, and its verdict is a ratio measured
      # on the host it ran on. A shared CI runner is the worst place to measure
      # that and the worst place to trust the number. Run it where you can
      # attribute the clock.
      #
      # ------------------------------------------------------------ 10.2 -> 11.5
      # crossversion is in the list and needs a SECOND, OLDER install to write
      # the dump with; without IT_SRC_CUBRID it prints a SKIP and the suite stays
      # green. 10.2 is the floor -- the two hard 9.x -> 10.x breaks (SHA1 -> SHA2
      # passwords, CBRD-20659; the reuse_oid default, CBRD-23708) are below it and
      # need a migration step before any loader runs.
      #
      # --install-only: this engine is never compiled against, only run, so the
      # source tarball would be half the download for nothing.
      - name: cache the old engine
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: engine102/dl
          key: engine-10.2_latest-${{ github.run_id }}
          restore-keys: engine-10.2_latest-

      - name: fetch a 10.2 install to write the old dump with
        id: old
        continue-on-error: true
        run: bash tools/fetch_engine.sh --release 10.2_latest --install-only engine102

      # A published 10.x binary links the ncurses 5 sonames, which a current
      # runner image no longer ships. The harness links whatever major version IS
      # present under those names, and SKIPS with the reason if it cannot -- so a
      # missing library costs the crossversion case, never the build. Installing
      # them here when the archive still has them keeps it a real run.
      - name: ncurses 5, if this runner still has it
        continue-on-error: true
        run: sudo apt-get install -y -qq libncurses5 libtinfo5 || true

      - name: the functional suite (every case but perf)
        run: |
          set -euo pipefail
          # empty when the fetch failed, which the suite reads as "no old engine"
          # and turns into a SKIP rather than a failure
          if [ "${{ steps.old.outcome }}" = success ]; then
            export IT_SRC_CUBRID="$PWD/engine102/install"
          fi
          bash tests/run_tests.sh --bin="$PWD/build/cubrid-importdb" \
            roundtrip types ordering fkcycle dupname fkviolation dryrun degree \
            resume refusals corrupt compat crossversion

      - name: behaviour contract against that install
        run: |
          set -euo pipefail
          bash contract/check_surface.sh --install "$CUBRID"
          CONTRACT_CHECK_BIN="$PWD/build/contract_check" bash contract/run.sh

      - name: negative control -- a non-DBA must FAIL the contract
        run: |
          if CONTRACT_CHECK_BIN="$PWD/build/contract_check" CONTRACT_NEGATIVE=1 \
               bash contract/run.sh; then
            echo "::error::the negative control PASSED -- the suite is not discriminating"
            exit 1
          fi
          echo "negative control failed the contract, as required"

      - name: logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-${{ steps.pick.outputs.version }}-logs
          path: |
            /tmp/build.log
            engine/install/log/**
            engine102/install/log/**
          retention-days: 7
